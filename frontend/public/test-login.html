<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #5568d3;
        }
        pre {
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Backend Authentication Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Login with Admin</h2>
        <button onclick="testLogin('admin', 'password123')">Test Admin Login</button>
        <pre id="result1">Click button to test...</pre>
    </div>

    <div class="test-section">
        <h2>Test 2: Login with Ashutosh93</h2>
        <button onclick="testLogin('Ashutosh93', 'password123')">Test Ashutosh93 Login</button>
        <pre id="result2">Click button to test...</pre>
    </div>

    <div class="test-section">
        <h2>Test 3: Custom Login</h2>
        <input type="text" id="customUsername" placeholder="Username" style="padding: 8px; margin: 5px;">
        <input type="password" id="customPassword" placeholder="Password" style="padding: 8px; margin: 5px;">
        <button onclick="testCustomLogin()">Test Custom Login</button>
        <pre id="result3">Enter credentials and click button...</pre>
    </div>

    <div class="test-section">
        <h2>Test 4: Register New User</h2>
        <button onclick="testRegister()">Test Registration</button>
        <pre id="result4">Click button to test...</pre>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';

        async function testLogin(username, password) {
            const resultId = username === 'admin' ? 'result1' : 'result2';
            const resultEl = document.getElementById(resultId);
            
            resultEl.innerHTML = 'Testing...';
            
            try {
                console.log('Testing login:', { username, password: '***' });
                console.log('URL:', `${API_URL}/auth/login`);
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultEl.innerHTML = `<span class="success">✅ SUCCESS!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultEl.innerHTML = `<span class="error">❌ FAILED (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ ERROR</span>\n\n${error.message}`;
                console.error('Login error:', error);
            }
        }

        async function testCustomLogin() {
            const username = document.getElementById('customUsername').value;
            const password = document.getElementById('customPassword').value;
            const resultEl = document.getElementById('result3');
            
            if (!username || !password) {
                resultEl.innerHTML = '<span class="error">Please enter both username and password</span>';
                return;
            }
            
            resultEl.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultEl.innerHTML = `<span class="success">✅ SUCCESS!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultEl.innerHTML = `<span class="error">❌ FAILED (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ ERROR</span>\n\n${error.message}`;
                console.error('Login error:', error);
            }
        }

        async function testRegister() {
            const resultEl = document.getElementById('result4');
            resultEl.innerHTML = 'Testing...';
            
            const testUser = {
                username: 'testuser' + Date.now(),
                email: 'test' + Date.now() + '@example.com',
                password: 'password123',
                firstName: 'Test',
                lastName: 'User',
                roles: ['USER']
            };
            
            try {
                console.log('Testing registration:', testUser);
                
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testUser)
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultEl.innerHTML = `<span class="success">✅ SUCCESS!</span>\n\nUser created: ${testUser.username}\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultEl.innerHTML = `<span class="error">❌ FAILED (${response.status})</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ ERROR</span>\n\n${error.message}`;
                console.error('Registration error:', error);
            }
        }

        // Test on page load
        window.onload = () => {
            console.log('API URL:', API_URL);
            console.log('Test page loaded. Click buttons to test authentication.');
        };
    </script>
</body>
</html>
