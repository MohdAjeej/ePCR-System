# Server Configuration
server.port=8080
spring.application.name=epcr-backend

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/epcr
spring.data.mongodb.database=epcr

# JWT Configuration
# HS512 requires a key of at least 512 bits (64 bytes)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437772141442A472D4B614E645267556B58703273357638792F423F4528482B4D6251
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=http://localhost:3000

# Logging
logging.level.com.epcr=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
